<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 8</title>
</head>
<body style="background-color: black; color:rgb(193, 193, 193)";>
    <form action="">
        <fieldset>
            <legend>Estado Civíl</legend>
            <p>
                <input type="radio"
                name="estado_civil" id="casado"
                value="casado">
                <label for="casado">Casado</label>
            </p>
            <p>
                <input type="radio"
                name="estado_civil" id="solteiro"
                value="solteiro">
                <label for="casado">Solteiro</label>
            </p>
            <p>
                <input type="radio"
                name="estado_civil" id="viuvo"
                value="casado">
                <label for="viuvo">Viúvo</label>
            </p>
            <p>
                <input type="radio"
                name="estado_civil" id="divorciado"
                value="divorciado">
                <label for="casado">Divorciado</label>
            </p>
        </fieldset>
    </form>

    <p>
        <label for="estado">Estado</label>
        <select name="estado" id="estado">
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espirito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraiba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RD">Rondônia</option>
            <option value="RM">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
        </select>
    </p>
    <p>
        <label for="meiosTransporte">Meios de Transporte</label>
        <select name="meiosTransporte" id="meiosTransporte">
            <optgroup label="Carros">
                <option value="fusca">Fusca</option>
                <option value="opala">Opala</option>
                <option value="fiesta">Fiesta</option>
                <option value="brasilia">Brasília</option>
                <option value="savero">Savero</option>
                <option value="gol">Gol</option>
                <option value="kwid">Kwid</option>
            </optgroup>
            <optgroup label="Motos">
                <option value="yamaha">Yamaha</option>
                <option value="harley">Harley</option>
                <option value="honda">Honda</option>
                <option value="ninja">Ninja</option>
            </optgroup>
        </select>
    </p>

    <form>
        <fieldset>
            <legend>Equipamentos</legend>
            <p>
                <input type="checkbox"
                name="monitor" id="monitor"
                value="monitor">
            <label for="monitor">Monitor</label>
            </p>

            <p>
                <input type="checkbox"
                name="impressora" id="impressora"
                value="impressora">
            <label for="impressora">Impressora</label>
            </p>
            
            <p>
                <input type="checkbox"
                name="mouse" id="mouse"
                value="mouse">
            <label for="mouse">Mouse</label>
            </p>

            <p>
                <input type="checkbox"
                name="teclado" id="teclado"
                value="teclado">
            <label for="monitor">Teclado</label>
            </p>            
        </fieldset>
    </form>
    <input type="submit" value="Enviar Dados">
</body>
</html>
