<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>
<body>
    <h1>Tipos de Formulários</h1>
    <form>
        <p>
            <label for="nome">Nome :</label>
            <input type="text" id="nome" name="nome">
        </p>
        <p>
            <label for="sobrenome">Sobrenome : </label>
            <input type="text" id="sobrenome" name="sobrenome">
        </p>
        <p>
            <label for="telefone">Telefone : </label>
            <input type="tel" id="telefone" name="telefone" placeholder="+55 (00) 00000-0000">
        </p>
        <p>
            <label for="email">E-mail : </label>
            <input type="email" id="email" name="email">                
        </p>
        <p>
            <label for="url">Website : </label>
            <input type="url" id="url" name="url">
        </p>
        <p>
            <label for="numero">Nota : </label>
            <input type="number" id="numero" name="numero" min="0" max="10">
        </p>
        <p>
            <label for="range">Faixa : </label>
            <input type="range" id="range" name="range" min="0" max="100">
        </p>
        <p>
            <label for="cor">Cor : </label>
            <input type="color" id="cor" name="cor">
        </p>
        <p>
            <label for="arquivo">Arquivo : </label>
            <input type="file" id="arquivo" name="arquivo">
        </p>
        <p>
            <label for="senha">Senha : </label>
            <input type="password" id="senha" name="senha">
        </p>
        <p>
            <label for="pesquisa">Pesquisa : </label>
            <input type="search" id="pesquisa" name="pesquisa">
        </p>
        <p>
            <label for="checkbox">Checkbox : </label>
            <input type="checkbox" id="checkbox" name="checkbox">
        </p>
        <p>
            <label for="radio1">Opção 1 : </label>
            <input type="radio" id="radio1" name="radio" value="1">
            <label for="radio2">Opção 2 : </label>
            <input type="radio" id="radio2" name="radio" value="2">
        </p>
        <p>
            <label for="select">Seleção : </label>
            <select id="select" name="select">
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
                <option value="opcao3">Opção 3</option>
            </select>
        </p>
        <p> 
            <label for="hidden">Campo Oculto : </label>
            <input type="hidden" id="hidden" name="hidden" value="valor_oculto">
        </p>
        <p>
            <label for="textarea">Área de Texto : </label>
            <textarea id="textarea" name="textarea" rows="4" cols="50"></textarea>
        </p>
        <h1>Tipos de Data</h1>
        <p>
            <label for="data">Data : </label>
            <input type="date" id="data" name="data">
        </p>
        <p>
            <label for="semana">Semana : </label>
            <input type="week" id="semana" name="semana">
        </p>
        <p>
            <label for="mes">Mês : </label>
            <input type="month" id="mes" name="mes">
        </p>
        <p>
            <label for="hora">Hora : </label>
            <input type="time" id="hora" name="hora" step="300">
        </p>
        <p>
            <label for="datetime">Data e Hora : </label>
            <input type="datetime-local" id="datetime" name="datetime">
        </p>
        <p>
            <input type="submit" value="Enviar Dados">
        </p>
        <h1>OS BOTÕES DE AÇUCAR NÃÃÃÃÃO</h1>
        <button type="button" onclick="mensagem()">Botão simples</button>
        <button type="submit">Botão de envio</button>
        <button type="reset">Botão de reset</button>

    </form>
    <script>
        function mensagem(){
            alert("Boa noite!");
        }
    </script>
</body>
</html>
